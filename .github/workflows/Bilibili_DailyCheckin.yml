# ============================================================
# 二合一最终版 = 飞书群机器人推送 + 消除 Node.js 20 弃用警告
# 相对仓库 17:57 那版的改动：
#   1) actions/checkout@v3 -> @v7、actions/setup-python@v4 -> @v7
#      （两者 action.yml 均为 runs.using: node24，警告随之消失）
#   2) 推送步骤增加诊断输出：打印 webhook 是否已配置、飞书返回码判定结果
# 其余完全不变：关闭投币的 TASK_CONFIG、PushPlus、cron、全部 Secret 名称
# 若 @v7 出现兼容问题，把这两行改回 @v3 / @v4 即可回退
# ============================================================
name: Bilibili Daily Checkin

on:
  schedule:
    # GitHub 的 schedule 是「尽力而为」：整点高负载时可能延迟数小时，甚至整次丢弃。
    # 因此避开整点，并设 3 个错峰时段互为备份；签到接口重复调用会返回「今日已签」。
    # cron 按 UTC 计时，括号内为北京时间（UTC+8）。
    - cron: '17 2 * * *'    # 02:17 UTC = 10:17 北京（主时段）
    - cron: '23 5 * * *'    # 05:23 UTC = 13:23 北京（备份）
    - cron: '37 9 * * *'    # 09:37 UTC = 17:37 北京（备份）
  workflow_dispatch:  # 支持手动触发

concurrency:
  group: bili-daily-checkin
  cancel-in-progress: false

jobs:
  run-bilibili-task:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests loguru

      - name: Run Bilibili Task
        id: bili
        env:
          # 必需的环境变量
          BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIE }}

          # 可选的环境变量
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          # 写死任务列表，去掉 add_coin 即关闭投币；不依赖 Secret 是否存在
          TASK_CONFIG: live_sign,manga_sign,share_video
          COIN_ADD_NUM: ${{ secrets.COIN_ADD_NUM }}
          COIN_SELECT_LIKE: ${{ secrets.COIN_SELECT_LIKE }}
          COIN_VIDEO_SOURCE: ${{ secrets.COIN_VIDEO_SOURCE }}

        run: |
          set -o pipefail
          python main.py 2>&1 | tee task.log

      - name: 推送飞书群机器人
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          FEISHU_KEYWORD: ${{ secrets.FEISHU_KEYWORD }}
          BILI_OUTCOME: ${{ steps.bili.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os, re, json, time, hmac, hashlib, base64, urllib.request

          webhook = os.environ.get("FEISHU_WEBHOOK", "").strip()
          print("诊断: FEISHU_WEBHOOK =", "已配置" if webhook else "未配置")
          if not webhook:
              print("未配置 FEISHU_WEBHOOK，跳过飞书推送（签到任务本身不受影响）")
              raise SystemExit(0)

          secret = os.environ.get("FEISHU_SECRET", "").strip()
          keyword = os.environ.get("FEISHU_KEYWORD", "").strip()
          outcome = os.environ.get("BILI_OUTCOME", "unknown")
          trigger = os.environ.get("TRIGGER", "")
          run_url = os.environ.get("RUN_URL", "")
          ok = (outcome == "success")
          print("诊断: 签到步骤结果 =", outcome, "| 签名校验 =", "启用" if secret else "未启用",
                "| 关键词 =", keyword or "无")

          try:
              with open("task.log", "r", encoding="utf-8", errors="replace") as f:
                  log = f.read()
          except OSError:
              log = "(未找到 task.log)"

          log = re.sub(r"\x1b\[[0-9;]*[A-Za-z]", "", log).replace("\r", "").strip()
          if len(log) > 6000:
              log = "……(内容过长，仅显示末尾)\n" + log[-6000:]
          if not log:
              log = "(无输出)"

          trigger_cn = {"schedule": "定时", "workflow_dispatch": "手动"}.get(trigger, trigger or "未知")
          title = "B站每日任务 · 成功" if ok else "B站每日任务 · 失败"
          if keyword:
              title = keyword + " · " + title

          card = {
              "schema_version": "1.0",
              "config": {"wide_screen_mode": True},
              "header": {
                  "template": "green" if ok else "red",
                  "title": {"tag": "plain_text", "content": title}
              },
              "elements": [
                  {"tag": "div", "text": {"tag": "lark_md", "content":
                      "**运行结果**：{}\n**触发方式**：{}\n**详情**：[查看 GitHub 运行日志]({})".format(
                          "成功" if ok else "失败", trigger_cn, run_url)}},
                  {"tag": "hr"},
                  {"tag": "div", "text": {"tag": "lark_md", "content": "```\n{}\n```".format(log)}}
              ]
          }
          payload = {"msg_type": "interactive", "card": card}

          if secret:
              ts = str(int(time.time()))
              string_to_sign = "{}\n{}".format(ts, secret)
              sign = base64.b64encode(
                  hmac.new(string_to_sign.encode("utf-8"), digestmod=hashlib.sha256).digest()
              ).decode("utf-8")
              payload["timestamp"] = ts
              payload["sign"] = sign

          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"}
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  body = resp.read().decode("utf-8", "replace")
              print("飞书返回:", body)
              try:
                  data = json.loads(body)
                  accepted = (data.get("code", data.get("StatusCode", -1)) == 0)
              except ValueError:
                  accepted = False
              print("飞书推送结果:", "成功" if accepted else "被拒绝（检查关键词 / 签名 / IP 白名单）")
          except Exception as e:
              print("飞书推送失败（不影响签到任务结果）:", type(e).__name__, str(e))
          PY
